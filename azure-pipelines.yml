# Java (Maven) -> Docker image built in ACR -> AKS
# Students only need: an ACR, an AKS cluster and an Azure Resource Manager service connection.
# Everything else is typed into the "Run pipeline" dialog below.
trigger: none
pr: none

parameters:
- name: acrName
  displayName: 'ACR name only (e.g. myacr, NOT myacr.azurecr.io)'
  type: string
- name: aksResourceGroup
  displayName: 'AKS resource group'
  type: string
- name: aksClusterName
  displayName: 'AKS cluster name'
  type: string
- name: azureServiceConnection
  displayName: 'Azure Resource Manager service connection name'
  type: string
  default: 'azure-sub-conn'

variables:
  imageRepository: 'hello-aks'
  imageTag: '$(Build.BuildId)'
  k8sNamespace: 'demo'

stages:
# ------------------------------ BUILD ------------------------------
- stage: Build
  displayName: 'Build, test, push image'
  jobs:
  - job: Build
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: AzureCLI@2
      displayName: 'Pre-flight: check ACR and AKS'
      inputs:
        azureSubscription: ${{ parameters.azureServiceConnection }}
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e
          if ! ACR_ID=$(az acr show -n "${{ parameters.acrName }}" --query id -o tsv 2>/dev/null); then
            echo "##vso[task.logissue type=error]ACR '${{ parameters.acrName }}' not found in this subscription. Enter the name only, without .azurecr.io."
            exit 1
          fi
          if ! KUBELET=$(az aks show -g "${{ parameters.aksResourceGroup }}" -n "${{ parameters.aksClusterName }}" \
                --query identityProfile.kubeletidentity.objectId -o tsv 2>/dev/null); then
            echo "##vso[task.logissue type=error]AKS cluster '${{ parameters.aksClusterName }}' not found in resource group '${{ parameters.aksResourceGroup }}'."
            exit 1
          fi
          PULL=$(az role assignment list --assignee "$KUBELET" --scope "$ACR_ID" \
                --query "[?roleDefinitionName=='AcrPull'] | length(@)" -o tsv 2>/dev/null || echo 0)
          if [ "${PULL:-0}" = "0" ]; then
            echo "##vso[task.logissue type=warning]AKS has no AcrPull role on this ACR yet. The Deploy stage will try to fix this automatically."
          else
            echo "OK: AKS can pull from ACR."
          fi

    - task: Maven@4
      displayName: 'Maven compile + unit tests'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean verify'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.17'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'

    # Builds the Dockerfile inside ACR (ACR Tasks) and stores the image there.
    # Uses the same Azure service connection: no Docker Registry service connection needed.
    - task: AzureCLI@2
      displayName: 'Build image in ACR and push'
      inputs:
        azureSubscription: ${{ parameters.azureServiceConnection }}
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e
          az acr build \
            --registry "${{ parameters.acrName }}" \
            --image "$(imageRepository):$(imageTag)" \
            --image "$(imageRepository):latest" \
            --file Dockerfile .

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Kubernetes manifests'
      inputs:
        targetPath: 'k8s'
        artifact: 'manifests'

# ------------------------------ DEPLOY ------------------------------
# Optional: Pipelines > Environments > aks-dev > Approvals and checks > add an approver.
- stage: Deploy
  displayName: 'Deploy to AKS'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployAKS
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'aks-dev'
    strategy:
      runOnce:
        deploy:
          steps:
          # manifests artifact is downloaded automatically to $(Pipeline.Workspace)/manifests
          - bash: |
              set -e
              F=$(Pipeline.Workspace)/manifests/deployment.yaml
              sed -i "s|__IMAGE__|${{ lower(parameters.acrName) }}.azurecr.io/$(imageRepository):$(imageTag)|g; s|__TAG__|$(imageTag)|g" "$F"
              grep -n "image:\|APP_VERSION" -A1 "$F"
            displayName: 'Inject image name and tag into manifest'

          - task: KubernetesManifest@1
            displayName: 'Create namespace'
            inputs:
              action: deploy
              connectionType: azureResourceManager
              azureSubscriptionConnection: ${{ parameters.azureServiceConnection }}
              azureResourceGroup: ${{ parameters.aksResourceGroup }}
              kubernetesCluster: ${{ parameters.aksClusterName }}
              useClusterAdmin: true
              manifests: $(Pipeline.Workspace)/manifests/namespace.yaml

          - task: AzureCLI@2
            displayName: 'Ensure AKS can pull from ACR (auto-fix)'
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                RG="${{ parameters.aksResourceGroup }}"
                AKS="${{ parameters.aksClusterName }}"
                ACR="${{ parameters.acrName }}"

                ACR_ID=$(az acr show -n "$ACR" --query id -o tsv)
                KUBELET=$(az aks show -g "$RG" -n "$AKS" --query identityProfile.kubeletidentity.objectId -o tsv)
                PULL=$(az role assignment list --assignee "$KUBELET" --scope "$ACR_ID" \
                       --query "[?roleDefinitionName=='AcrPull'] | length(@)" -o tsv 2>/dev/null || echo 0)

                # 1. Already allowed?
                if [ "${PULL:-0}" != "0" ]; then
                  echo "AKS already has AcrPull on the ACR. Nothing to do."
                  exit 0
                fi

                # 2. Try the clean fix (needs permission to create role assignments)
                echo "Trying: az aks update --attach-acr $ACR"
                if az aks update -g "$RG" -n "$AKS" --attach-acr "$ACR" -o none; then
                  echo "ACR attached (AcrPull granted to AKS)."
                  exit 0
                fi

                # 3. Fallback: image pull secret using the ACR admin user (needs only Contributor)
                echo "##vso[task.logissue type=warning]The service principal cannot create role assignments, so using an image pull secret (ACR admin user) instead. For a cleaner setup, grant it User Access Administrator or attach the ACR when creating AKS."
                az acr update -n "$ACR" --admin-enabled true -o none
                SERVER=$(az acr show -n "$ACR" --query loginServer -o tsv)
                REG_USER=$(az acr credential show -n "$ACR" --query username -o tsv)
                REG_PASS=$(az acr credential show -n "$ACR" --query "passwords[0].value" -o tsv)
                echo "##vso[task.setsecret]$REG_PASS"

                OUT=$(az aks command invoke -g "$RG" -n "$AKS" --command \
                  "kubectl create secret docker-registry acr-pull-secret --docker-server=$SERVER --docker-username=$REG_USER --docker-password='$REG_PASS' -n $(k8sNamespace) --dry-run=client -o yaml | kubectl apply -f -")
                echo "$OUT" | sed "s/$REG_PASS/***/g"
                echo "$OUT" | grep -q "exitcode=0" || { echo "##vso[task.logissue type=error]Could not create the image pull secret."; exit 1; }
                echo "Image pull secret created."

          - task: KubernetesManifest@1
            displayName: 'Deploy app + service'
            inputs:
              action: deploy
              connectionType: azureResourceManager
              azureSubscriptionConnection: ${{ parameters.azureServiceConnection }}
              azureResourceGroup: ${{ parameters.aksResourceGroup }}
              kubernetesCluster: ${{ parameters.aksClusterName }}
              useClusterAdmin: true
              namespace: $(k8sNamespace)
              rolloutStatusTimeout: 420
              manifests: |
                $(Pipeline.Workspace)/manifests/deployment.yaml
                $(Pipeline.Workspace)/manifests/service.yaml

          # Runs only if the deploy failed: prints why the pods are not Ready (pull errors, probes, scheduling)
          - task: AzureCLI@2
            displayName: 'Diagnostics (only runs if deploy failed)'
            condition: failed()
            continueOnError: true
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks command invoke -g "${{ parameters.aksResourceGroup }}" -n "${{ parameters.aksClusterName }}" \
                  --command "kubectl get pods -n $(k8sNamespace) -o wide; kubectl describe pods -n $(k8sNamespace) -l app=hello-aks; kubectl get events -n $(k8sNamespace) --sort-by=.lastTimestamp; kubectl logs -n $(k8sNamespace) -l app=hello-aks --tail=40"

          - task: AzureCLI@2
            displayName: 'Show pods and public IP'
            continueOnError: true
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks command invoke -g "${{ parameters.aksResourceGroup }}" -n "${{ parameters.aksClusterName }}" \
                  --command "kubectl get pods,svc -n $(k8sNamespace) -o wide"
