apiVersion: v1
kind: Service
metadata:
  name: hello-aks-svc
  namespace: demo
  labels:
    app: hello-aks
spec:
  type: LoadBalancer        # gets a public IP on AKS
  selector:
    app: hello-aks
  ports:
  - port: 80                # public port
    targetPort: 8080        # Tomcat inside the container
